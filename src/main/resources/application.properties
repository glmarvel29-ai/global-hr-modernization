# =============================================================================
# ERM Complexity Demo — application configuration
# Dual-database ready: Oracle + PostgreSQL (Complexity table). Default = H2 demo.
# LEGACY PROBLEM: High code dependencies — dialect switching historically required
# custom Hibernate forks carried from acquired products (RiskGuard / AuditPro).
# =============================================================================

spring.application.name=erm-complexity-demo
server.port=8090

# JSP classic Spring MVC (not Thymeleaf)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.context-path=/

# --- Default profile: H2 in-memory (local viewable demo) ---
spring.datasource.url=jdbc:h2:mem:ermdemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Auth/session hardening defaults
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Miniaturized scale notes (production: 2.2M LOC / 8000+ tables / 4500+ APIs)
erm.scale.loc-cap=5000
erm.scale.modules=9
erm.scale.product-age-years=15
erm.legacy.architecture=hybrid-monolith-microservices
